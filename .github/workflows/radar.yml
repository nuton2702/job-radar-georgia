name: Update job radar
on:
  workflow_dispatch:
  push:
    branches: [main, source-expansion]
    paths: ['scripts/**', 'tests/**', 'dist/data/sources.json', 'dist/data/search-config.json', '.github/workflows/radar.yml']
  schedule:
    - cron: '13,43 6-19 * * *' # 10:13–23:43 Tbilisi; catch up until one scheduled check completes.
permissions:
  contents: write
concurrency:
  group: radar-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check whether today's scheduled scan is due
        id: daily
        run: python scripts/schedule_gate.py
      - name: Test verification rules
        if: steps.daily.outputs.due == 'true'
        run: python -m unittest discover -s tests -v
      - name: Check official sources
        if: steps.daily.outputs.due == 'true'
        run: python scripts/radar.py
      - name: Build consistent snapshot
        if: always() && steps.daily.outputs.due == 'true'
        run: python scripts/build.py
      - name: Save results and failure history
        if: always() && steps.daily.outputs.due == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data dist/data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update radar source checks and data'
            git push
          fi

