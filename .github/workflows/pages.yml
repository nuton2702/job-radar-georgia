name: Publish radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Update job radar']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - name: Prepare public site
        run: |
          mkdir public-site
          cp dist/index.html dist/app.js dist/style.css dist/data.js public-site/
          mkdir public-site/data
          cp dist/data/bundle.json public-site/data/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
