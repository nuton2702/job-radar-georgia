name: Publish radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Update job radar']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check dist/app.js
      - run: python scripts/build.py
      - name: Prepare public site
        run: |
          mkdir public-site
          cp dist/index.html dist/app.js dist/style.css dist/data.js public-site/
          mkdir public-site/data
          cp dist/data/bundle.json public-site/data/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public-site
      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts | map(select(.expired == false)) | length') || count=0
            if [ "$count" = "1" ]; then
              echo "Pages artifact is visible through the API."
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/18)."
            sleep 10
          done
          echo "::error::Uploaded Pages artifact did not become visible."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public site and database
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_public.py
