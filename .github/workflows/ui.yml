name: Test dashboard
on:
  push:
    branches: [main, source-expansion]
    paths: ['dist/app.js', 'dist/index.html', 'dist/style.css', 'ui-tests/**', '.github/workflows/ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --check dist/app.js
      - run: node ui-tests/freshness.cjs
