<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка адаптивности</title><style>body{margin:0;font:16px sans-serif;background:#dde4ea}header{padding:12px}iframe{display:block;border:0;height:900px;background:white}button,select{font:inherit;padding:8px}</style><header><label>Ширина <select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1440</option></select></label> <button id="check">Проверить переполнение</button> <span id="result"></span></header><iframe title="Мобильный прототип" src="index.html" width="390"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.width=e.target.value;document.querySelector('#check').onclick=()=>{const d=frame.contentDocument;document.querySelector('#result').textContent=`Ширина ${d.documentElement.clientWidth}: контент ${d.documentElement.scrollWidth}px, ${d.documentElement.scrollWidth<=d.documentElement.clientWidth?'OK':'OVERFLOW'}`;};</script></html>
